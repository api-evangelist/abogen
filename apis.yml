name: Abogen
description: 'Abogen Biosciences (Suzhou Abogen Biosciences Co., Ltd. / 苏州艾博生物科技有限公司)
  is a clinical-stage biotechnology company founded in January 2019 and headquartered in Suzhou, China,
  dedicated to developing transformative medicines through messenger RNA (mRNA) innovation. The company
  has built full-scale in-house capabilities spanning the entire mRNA drug development cycle - protein
  engineering, mRNA sequence design and synthesis, proprietary lipid nanoparticle (LNP) delivery,
  formulation, and commercial-scale manufacturing. Its product pipeline covers infectious disease
  prevention and cancer immunotherapy, and it has advanced an EUA mRNA product along with additional
  clinical-stage candidates. Abogen is a portfolio company of the SoftBank Vision Fund. Abogen is a
  pharmaceutical / biotechnology company and does not currently publish a public developer platform,
  API, or SDK; this profile captures its corporate identity in the API Evangelist network.'
